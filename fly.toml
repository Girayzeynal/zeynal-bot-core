app = "zeynal-bot-core"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = 5

[env]
  PORT = "8080"

[build]
  buildpacks = ["paketo-buildpacks/python"]

[http_service]
  internal_port = 8080
  processes = ["app"]
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  concurrency = { type = "requests", soft_limit = 100, hard_limit = 200 }
