# fly.toml – FINAL STABLE BOT CONFIG
# Optimized for Telegram Polling + Health Server
# Delta-Sync Verified

app = "zeynal-bot-core"
primary_region = "ams"

[build]

# ============================================================
#   HTTP HEALTH SERVICE (8080)
# ============================================================
[http_service]
  internal_port = 8080
  force_https = true

  auto_stop_machines = false     # Bot kapanmasın
  auto_start_machines = true
  min_machines_running = 1       # Daima açık olsun

  processes = ["app"]

# ============================================================
#   PROCESS GROUP DEFINITIONS
# ============================================================
[processes]
  app = "python main.py"

# ============================================================
#   VM SETTINGS
# ============================================================
[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  memory_mb = 1024 
