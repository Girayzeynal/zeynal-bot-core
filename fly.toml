app = "zeynal-bot-core"
primary_region = "fra"

[env]

[build]
  builder = "heroku/builder:24" 

  [build]
  builder = "heroku/builder:24"
  buildpacks = ["heroku/python"]

[processes]
  worker = "python bot.py"

[[services]]
  internal_port = 8080
  processes = ["worker"]
  protocol = "tcp"

  [[services.ports]]
    port = 80

  [[services.ports]]
    port = 443
