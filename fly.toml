app = "zeynal-bot-core"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"
# API uç noktaları ve varsayılan değerler
API_SPORTS_BASE = "https://v1.basketball.api-sports.io"
ODDS_BASE       = "https://api.the-odds-api.com/v4"
ODDS_REGIONS    = "us"
ODDS_MARKETS    = "totals,spreads"
ODDS_FORMAT     = "decimal"
# İstatistik dosyaları için dizin
BASELINE_DIR    = "data/baselines"
FAZ23_STORAGE   = "faz23_storage.sqlite" 
