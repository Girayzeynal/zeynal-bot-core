app = 'zeynal-bot-core'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  auto_stop = "off"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
