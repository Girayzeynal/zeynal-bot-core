app = "zeynal-bot-core"
primary_region = "ams"

[env]
PORT = "8080"

# ============================================================
#               PROCESS: Bot'u main.py ile çalıştır
# ============================================================
[processes]
app = "python main.py"

# ============================================================
#               SERVICES (Stable Healthcheck + HTTP + TLS)
# ============================================================
[[services]]
processes = ["app"]
internal_port = 8080
protocol = "tcp"

  [services.concurrency]
  type = "requests"
  soft_limit = 20
  hard_limit = 30

  # HTTP Port (80)
  [[services.ports]]
  port = 80
  handlers = ["http"]

  # HTTPS Port (443)
  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  # ============================================================
  #        🛡️  STABLE HEALTH CHECK (FAZ-8 UPGRADE VERSION)
  # ============================================================
  [[services.http_checks]]
    interval = "30s"       # Daha yavaş → daha kararlı
    timeout = "3s"         # Mantıklı timeout
    grace_period = "30s"   # Bot açılırken zaman tanır
    method = "get"
    path = "/"             # Sadece home endpoint kontrol edilir
    protocol = "http"

# ============================================================
#            EXPERIMENTAL — Auto Rollback açık
# ============================================================
[experimental]
auto_rollback = true
