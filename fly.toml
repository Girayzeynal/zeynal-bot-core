app = "zeynal-bot-core"
primary_region = "otp" # Türkiye'ye yakınlık için 'otp' (Bükreş) veya 'fra' (Frankfurt) seçilebilir

[build]
  # Dockerfile kullanıyorsan bu satır kalsın
  # python-buildpack kullanıyorsan buildpack ayarı eklenebilir

[env]
  API_SPORTS_BASE = "https://v1.basketball.api-sports.io"
  ODDS_BASE = "https://api.the-odds-api.com/v4"
  # Önemli: Takım istatistiklerinin yolu
  TEAM_STATS_FILE = "/data/team_stats.json" 
  BASELINE_DIR = "/data/baselines"
  FAZ23_STORAGE = "/data/faz23_storage.sqlite"

[[mounts]]
  source = "zeynal_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false # Botun uyumaması için kritik
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb" # Monte Carlo simülasyonları için en az 512MB önerilir
  cpus = 1

[[services]]
  protocol = "tcp"
  internal_port = 8080
  
  # Botun Telegram ile bağlantısının kopmaması için timeout sürelerini uzun tutuyoruz
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20
 
