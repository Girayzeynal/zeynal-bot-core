# fly.toml – FINAL V2 (Health-Check Stabil Version)

app = "zeynal-bot-core"
primary_region = "ams"

[build]

# ============================================================
#   HTTP HEALTH SERVICE
# ============================================================
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

# ============================================================
#   HEALTH CHECK (Fly'ın botu kapatmaması için)
# ============================================================
[checks]
  [checks.health]
    type = "http"
    port = 8080
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    path = "/"
    method = "get"

# ============================================================
#   PROCESS GROUP DEFINITIONS
# ============================================================
[processes]
  app = "python main.py"

# ============================================================
#   VM SETTINGS
# ============================================================
[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024 
