app = "zeynal-bot-core"
primary_region = "iad"

[env]
  PORT = "8080"

[processes]
  app = "python3 main.py"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[metrics]
  port = 9091
  path = "/metrics"

[experimental]
  auto_rollback = true 
