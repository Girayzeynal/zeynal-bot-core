# fly.toml
# FAZ 3 – Zeynal Core Konfigürasyonu

app = "zeynal-bot-core"
primary_region = "ams"

[build]
  builder = "heroku/buildpacks:20"

[env]
  PYTHONUNBUFFERED = "1"
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
  [[services.ports]]
    port = 443 
