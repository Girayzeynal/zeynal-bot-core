# fly.toml app configuration file generated for zeynal-bot-core-rt5xwa on 2026-11-01T17:55:01Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zeynal-bot-core-rt5xwa'
primary_region = 'fra'
kill_signal = 'SIGINT'
kill_timeout = '5s'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_SPORTS_BASE = 'https://v1.basketball.api-sports.io'
  BASELINE_DIR = 'data/baselines'
  FAZ23_STORAGE = 'faz23_storage.sqlite'
  ODDS_BASE = 'https://api.the-odds-api.com/v4'
  ODDS_FORMAT = 'decimal'
  ODDS_MARKETS = 'totals'
  ODDS_REGIONS = 'us,eu'
  PYTHONUNBUFFERED = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '10s'
    timeout = '2s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
