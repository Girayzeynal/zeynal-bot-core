app = "zeynal-bot-core"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"

API_SPORTS_BASE = "https://v1.basketball.api-sports.io"
ODDS_BASE = "https://api.the-odds-api.com/v4"
ODDS_REGIONS = "us,eu"
ODDS_MARKETS = "totals"
ODDS_FORMAT = "decimal"

BASELINE_DIR = "data/baselines"
FAZ23_STORAGE = "faz23_storage.sqlite"
PREDICTION_LEDGER_DB = "/data/prediction_ledger.sqlite"

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
auto_stop_machines = false
min_machines_running = 1

[[http_service.checks]]
interval = "10s"
timeout = "2s"
method = "GET"
path = "/health"

# DEPLOYMENT GATE: existing zeynal_data is attached to stopped helper VM 805121f66139d8.
# Do not merge until its contents are backed up and the volume can be safely reassigned.
# Active bot VM 2876926b073608 currently has no mounts.
[[mounts]]
source = "zeynal_data"
destination = "/data"
