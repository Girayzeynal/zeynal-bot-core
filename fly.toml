# ============================================================
# 🧠 Zeynal-Bot-Core — Fly.io Free Plan SAFE MODE fly.toml
# 512 MB RAM, auto-start, controlled auto-stop
# ============================================================

app = "zeynal-bot-core"
primary_region = "ams"

kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"
WEB_CONCURRENCY = "1"

# ============================================================
# 🛰️ HTTP Services
# ============================================================
[[services]]
internal_port = 8080
protocol = "tcp"

auto_start = true
auto_stop = true
auto_stop_machines = true
min_machines_running = 0

[services.concurrency]
type = "connections"
hard_limit = 25
soft_limit = 20

[[services.ports]]
port = 80
handlers = ["http"]

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[[services.tcp_checks]]
grace_period = "1s"
interval = "10s"
timeout = "2s"
restart_limit = 0

# ============================================================
# 🧪 Checks (FREE SAFE MODE için minimal)
# ============================================================
[checks.health]
type = "http"
interval = "15s"
timeout = "2s"
path = "/"
grace_period = "10s"
