app = "zeynal-bot-core"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"

API_SPORTS_BASE = "https://v1.basketball.api-sports.io"
ODDS_BASE = "https://api.the-odds-api.com/v4"
ODDS_REGIONS = "us,eu"
ODDS_MARKETS = "totals"
ODDS_FORMAT = "decimal"

BASELINE_DIR = "data/baselines"
FAZ23_STORAGE = "faz23_storage.sqlite"
PREDICTION_LEDGER_DB = "/data/predictions/prediction_ledger.sqlite"

[http_service]
internal_port = 8080
force_https = true
auto_start_machines = true
auto_stop_machines = false
min_machines_running = 1

[[http_service.checks]]
interval = "10s"
timeout = "2s"
method = "GET"
path = "/health"

# Deployment prerequisite: provision Fly volume "zeynal_predictions" in ams
# before merging this config. Without it, Fly deploy can fail.
[[mounts]]
source = "zeynal_predictions"
destination = "/data/predictions"
