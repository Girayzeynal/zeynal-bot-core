app = "zeynal-bot-core"
primary_region = "ams"

# ============================================================
#                  ENVIRONMENT VARIABLES
# ============================================================
[env]
PORT = "8080"

# ============================================================
#                  PROCESS (MAIN BOT)
# ============================================================
[processes]
app = "python main.py"

# ============================================================
#                  SERVICES (HTTP + TLS + HEALTHCHECK)
# ============================================================
[[services]]
processes = ["app"]
internal_port = 8080
protocol = "tcp"

  # -------------------------------------
  # Concurrency (FAZ-8.5 Stabil Mod)
  # -------------------------------------
  [services.concurrency]
  type = "requests"
  soft_limit = 40
  hard_limit = 60

  # -------------------------------------
  # HTTP (80)
  # -------------------------------------
  [[services.ports]]
  port = 80
  handlers = ["http"]

  # -------------------------------------
  # HTTPS (443)
  # -------------------------------------
  [[services.ports]]
  port = 443
  handlers = ["tls", "http"]

  # -------------------------------------
  # HEALTHCHECK (FAZ-9 Upgrade)
  # -------------------------------------
  [[services.http_checks]]
    interval = "20s"          # Daha hızlı → daha duyarlı
    timeout = "3s"
    grace_period = "45s"      # Boot esnasında daha güvenli süre
    method = "get"
    path = "/"                # Flask home endpoint
    protocol = "http"
    tls_skip_verify = false

# ============================================================
#                 AUTO ROLLBACK (FAZ-9)
# ============================================================
[experimental]
auto_rollback = true

# ============================================================
#                 METRICS (OPSIONAL)
# ============================================================
[metrics]
port = 8080
path = "/"
