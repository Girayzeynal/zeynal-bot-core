app = "zeynal-bot-core"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

# =======================================================
# BUILD SYSTEM → Dockerfile kullan
# =======================================================
[build]
  dockerfile = "Dockerfile"

# =======================================================
# ENV
# =======================================================
[env]
  PORT = "8080"
  FAZ7_DIR = "/data/faz7"

# =======================================================
# VOLUME
# =======================================================
[[mounts]]
  source = "faz7_memory"
  destination = "/data"

# =======================================================
# PROCESS
# =======================================================
[processes]
  app = "python main.py"

# =======================================================
# SERVICE CONFIG
# =======================================================
[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"

  [services.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[services.http_checks]]
    interval = "20s"
    timeout = "4s"
    method = "get"
    path = "/"
    protocol = "http"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

# =======================================================
# VM CONFIG
# =======================================================
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb" 
