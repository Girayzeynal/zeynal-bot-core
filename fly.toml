app = "zeynal-bot-core"
kill_signal = "SIGINT"
kill_timeout = "5s"
primary_region = "ams"

[build]
dockerfile = "Dockerfile"

[env]
PYTHONUNBUFFERED = "1"

# API uç noktaları
API_SPORTS_BASE = "https://v1.basketball.api-sports.io"
ODDS_BASE = "https://api.the-odds-api.com/v4"

# Odds varsayılanları
ODDS_REGIONS = "us,eu"
ODDS_MARKETS = "totals"
ODDS_FORMAT = "decimal"

# Baseline klasörü (istersen volume ile kalıcı yaparsın)
BASELINE_DIR = "data/baselines"
FAZ23_STORAGE = "faz23_storage.sqlite" 
