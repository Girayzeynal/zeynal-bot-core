# fly.toml app configuration file generated for zeynal-bot-core on 2025-11-15T06:59:48Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'zeynal-bot-core'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
