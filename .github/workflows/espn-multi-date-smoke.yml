name: ESPN NBA multi-date smoke (dev-only)

on:
  push:
    branches:
      - dev/elite-phase-hardening-2026
    paths:
      - .github/workflows/espn-multi-date-smoke.yml
      - providers/espn_multi_date_smoke.py
      - providers/espn_live_smoke.py
      - tests/test_espn_multi_date_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  espn-multi-date:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify three historical NBA scoreboard dates (read-only)
        run: python -m providers.espn_multi_date_smoke 20251025 20251026 20251027
