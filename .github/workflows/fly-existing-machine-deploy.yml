name: Fly.io existing-volume machine deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to update the existing machine (brief outage possible)"
        required: true
        default: "CHECK_ONLY"

permissions:
  contents: read

concurrency:
  group: zeynal-fly-single-machine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify exact app, machine and volume before changing anything
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          case "${{ inputs.confirm_deploy }}" in CHECK_ONLY|DEPLOY) ;; *) echo 'Invalid confirmation value' >&2; exit 1 ;; esac
          flyctl auth whoami >/dev/null
          flyctl machines list --app zeynal-bot-core --json > /tmp/zeynal-machine.json
          flyctl volumes list --app zeynal-bot-core --json > /tmp/zeynal-volumes.json
          python3 - <<'PY'
          import json
          machines=json.load(open('/tmp/zeynal-machine.json'))
          volumes=json.load(open('/tmp/zeynal-volumes.json'))
          assert isinstance(machines,list) and isinstance(volumes,list), 'Unexpected CLI JSON shape'
          assert any(m.get('id')=='830932f77d2598' and m.get('region')=='ams' and any(x.get('volume')=='vol_4581deoz3xjnp594' and x.get('path')=='/data' for x in (m.get('config',{}).get('mounts') or [])) for m in machines), 'Expected AMS machine or /data mount missing'
          assert any(v.get('id')=='vol_4581deoz3xjnp594' and v.get('attached_machine_id')=='830932f77d2598' for v in volumes), 'Expected volume attachment missing'
          print('Verified existing AMS machine and /data volume mount')
          PY
      - name: Build and push versioned Docker image
        if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="registry.fly.io/zeynal-bot-core:github-${GITHUB_SHA}"
          flyctl auth docker
          docker build --build-arg "RELEASE_SHA=${GITHUB_SHA}" --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "ZEYNAL_DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Update only the existing volume-attached machine
        if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ZEYNAL_DEPLOY_IMAGE:-}"
          flyctl machine update 830932f77d2598 --app zeynal-bot-core --image "$ZEYNAL_DEPLOY_IMAGE" --yes --wait-timeout 300
          flyctl machines list --app zeynal-bot-core --json > /tmp/zeynal-after.json
          flyctl volumes list --app zeynal-bot-core --json > /tmp/zeynal-after-volumes.json
          python3 - <<'PY'
          import json
          machines=json.load(open('/tmp/zeynal-after.json'))
          volumes=json.load(open('/tmp/zeynal-after-volumes.json'))
          assert any(v.get('id')=='vol_4581deoz3xjnp594' and v.get('attached_machine_id')=='830932f77d2598' for v in volumes), 'Volume attachment changed'
          assert any(m.get('id')=='830932f77d2598' and m.get('state')=='started' and any(x.get('volume')=='vol_4581deoz3xjnp594' and x.get('path')=='/data' for x in (m.get('config',{}).get('mounts') or [])) for m in machines), 'Machine not started or /data mount changed'
          print('Existing machine started; original volume still attached')
          PY
      - name: Check-only summary
        if: ${{ inputs.confirm_deploy != 'DEPLOY' }}
        run: echo "Preflight passed; no deployment was performed."
