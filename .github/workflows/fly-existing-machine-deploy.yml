name: Fly.io existing-volume machine deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type DEPLOY to update the existing machine (brief outage possible)"
        required: true
        default: "CHECK_ONLY"

permissions:
  contents: read

concurrency:
  group: zeynal-fly-single-machine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify exact app, machine and volume before changing anything
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl auth whoami >/dev/null
          flyctl machine status 830932f77d2598 --app zeynal-bot-core --json > /tmp/zeynal-machine.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/zeynal-machine.json'))
          mounts=m.get('config',{}).get('mounts') or []
          assert m.get('id')=='830932f77d2598', 'Unexpected machine'
          assert m.get('region')=='ams', 'Unexpected region'
          assert any(x.get('volume')=='vol_4581deoz3xjnp594' and x.get('path')=='/data' for x in mounts), 'Expected volume mount missing: refusing deployment'
          print('Verified existing AMS machine and /data volume mount')
          PY
      - name: Update only the existing volume-attached machine
        if: ${{ inputs.confirm_deploy == 'DEPLOY' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl machine update 830932f77d2598 --app zeynal-bot-core --dockerfile Dockerfile --yes --wait-timeout 300
          flyctl machine status 830932f77d2598 --app zeynal-bot-core --json > /tmp/zeynal-after.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/zeynal-after.json'))
          mounts=m.get('config',{}).get('mounts') or []
          assert any(x.get('volume')=='vol_4581deoz3xjnp594' and x.get('path')=='/data' for x in mounts), 'Volume mount changed'
          assert m.get('state')=='started', 'Machine not started'
          print('Existing machine started; original volume still attached')
          PY
      - name: Check-only summary
        if: ${{ inputs.confirm_deploy != 'DEPLOY' }}
        run: echo "Preflight passed; no deployment was performed."
