name: FAZ25 isolated reliability exercise
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-poller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Synthetic polling, failure and backup exercises
        run: python -m unittest tests.test_faz25 tests.test_faz24 -v
