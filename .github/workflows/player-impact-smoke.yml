name: Player impact offline evidence gate

on:
  push:
    branches:
      - feature/three-league-roster-integration-20261121
    paths:
      - hybrid_engine/player_*.py
      - hybrid_engine/test_bot.py
      - hybrid_engine/models.py
      - hybrid_engine/distributions.py
      - tests/test_player_*.py
      - tests/test_three_league_roster_bridge.py
      - .github/workflows/player-impact-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-player-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Compile player-path modules
        run: |
          python -m py_compile hybrid_engine/player_effect_smoke.py hybrid_engine/player_shadow.py hybrid_engine/player_minutes.py hybrid_engine/test_bot.py
      - name: Fail if the actual fitted player forecast does not respond to a missing player
        run: |
          python -m pytest -q tests/test_player_effect_smoke.py tests/test_player_shadow.py tests/test_player_minutes.py tests/test_three_league_roster_bridge.py
      - name: Record numerical before-after synthetic simulation
        run: |
          python -m hybrid_engine.player_effect_smoke --output /tmp/player-effect-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-player-impact-numerical-report
          path: /tmp/player-effect-smoke.json
          if-no-files-found: error
