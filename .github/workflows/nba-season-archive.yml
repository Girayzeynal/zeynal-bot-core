name: NBA 2026-27 actual game archive
on:
  push:
    branches: [feature/nba-command-20261104]
    paths:
      - .github/workflows/nba-season-archive.yml
      - tools/archive_europe_2026_27.py
      - tests/test_archive_europe_2026_27.py
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: write
jobs:
  nba-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESPN HTTP dependency
        run: python -m pip install 'aiohttp>=3,<4'
      - name: Fetch completed 2026-27 NBA games
        run: python -m tools.archive_nba_2026_27 --database data/archive/nba_2026_27.sqlite
      - name: Verify actual archive rows
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('data/archive/nba_2026_27.sqlite')
          games=db.execute('select count(*) from games').fetchone()[0]
          days=db.execute('select count(*) from scan_days').fetchone()[0]
          print(f'ARCHIVED_GAMES={games} SCANNED_DAYS={days}')
          if games == 0 or days == 0:
              raise SystemExit('No actual games archived')
          PY
      - name: Upload verified NBA archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-2026-27-completed-games-sqlite
          path: data/archive/nba_2026_27.sqlite
          if-no-files-found: warn
          retention-days: 90
      - name: Persist verified archive on development branch
        if: success() && github.ref == 'refs/heads/feature/nba-command-20261104'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/archive/nba_2026_27.sqlite
          if git diff --cached --quiet; then
            echo "ARCHIVE_UNCHANGED"
          else
            git commit -m "data: persist verified NBA 2026-27 completed games [skip ci]"
            git push origin HEAD:feature/nba-command-20261104
          fi
  euro-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'aiohttp>=3,<4'
      - name: Validate provider key
        run: |
          if [ -z "$API_SPORTS_KEY" ]; then
            echo "::error::API_SPORTS_KEY GitHub Actions secret is not configured"
            exit 1
          fi
      - name: Archive real EuroLeague and EuroCup games
        run: python -m tools.archive_europe_2026_27 --start 2026-11-01 --end 2026-11-08
      - name: Verify European archive rows
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("data/archive/europe_2026_27.sqlite")
          counts={}
          for league in ("EuroLeague","EuroCup"):
              games=db.execute("select count(*) from games where league=?",(league,)).fetchone()[0]
              days=db.execute("select count(*) from scan_days where league=?",(league,)).fetchone()[0]
              print(f"{league}: ARCHIVED_GAMES={games} SCANNED_DAYS={days}")
              counts[league]=games
          if not any(counts.values()):
              raise SystemExit("No European completed games archived; do not claim success")
          PY
      - name: Upload European archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: europe-2026-27-sqlite-pilot
          path: data/archive/europe_2026_27.sqlite
          if-no-files-found: warn
          retention-days: 30
