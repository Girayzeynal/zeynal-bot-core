name: NBA 2026-27 actual game archive
on:
  push:
    branches: [feature/nba-command-20261104]
    paths:
      - .github/workflows/nba-season-archive.yml
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: read
jobs:
  nba-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESPN HTTP dependency
        run: python -m pip install 'aiohttp>=3,<4'
      - name: Fetch completed 2026-27 NBA games
        run: python -m tools.archive_nba_2026_27 --database data/archive/nba_2026_27.sqlite
      - name: Verify actual archive rows
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect('data/archive/nba_2026_27.sqlite')
          games=db.execute('select count(*) from games').fetchone()[0]
          days=db.execute('select count(*) from scan_days').fetchone()[0]
          print(f'ARCHIVED_GAMES={games} SCANNED_DAYS={days}')
          if games == 0 or days == 0:
              raise SystemExit('No actual games archived')
          PY
      - name: Upload verified NBA archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-2026-27-completed-games-sqlite
          path: data/archive/nba_2026_27.sqlite
          if-no-files-found: warn
          retention-days: 90
