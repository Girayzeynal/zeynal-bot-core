name: Python regression tests

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main
      - "dev/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build --tag zeynal-bot-core:ci .
      - name: Run regression suite inside deployment image
        run: docker run --rm --network none zeynal-bot-core:ci python -m unittest discover -s tests -v
      - name: Run bounded isolated hybrid command flow
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=96m
          zeynal-bot-core:ci python -m hybrid_engine.runtime_probe --exercise-hybrid
          --fixture /app/docs/prospective/euroleague-20261112/index-c87489f84f5efa2c3abfae51f641bc066a6ab875f44c94bc197a0a49588b03d1.json
      - name: Run bounded live NBA native-payload command flow
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=128m zeynal-bot-core:ci sh -c '
            python -m hybrid_engine.live_runtime --packet /app/docs/evidence/nba-phase843-resource-inputs-20261113.tar.gz --output-directory /tmp/nba-native &&
            python -m hybrid_engine.runtime_probe --exercise-live-nba --fixture /tmp/nba-native/fixture.json'
      - name: Run decision and calibration guard under container resource limits
        run: |
          docker run --rm --network none --read-only --cpus=1 --memory=256m --memory-swap=256m --tmpfs /tmp:rw,size=128m zeynal-bot-core:ci sh -c '
            python -m hybrid_engine.live_runtime --packet /app/docs/evidence/nba-phase843-resource-inputs-20261113.tar.gz --output-directory /tmp/nba-native &&
            python -m hybrid_engine.runtime_probe --exercise-decision --require-cgroup-limits --fixture /tmp/nba-native/fixture.json'
      - name: Run read-only NBA and EuroLeague replay under container resource limits
        run: >-
          docker run --rm --network none --read-only --cpus=1 --memory=256m --memory-swap=256m --tmpfs /tmp:rw,size=96m
          zeynal-bot-core:ci python -m hybrid_engine.runtime_probe --exercise-nba-replay --require-cgroup-limits
          --fixture /app/docs/prospective/euroleague-20261112/index-c87489f84f5efa2c3abfae51f641bc066a6ab875f44c94bc197a0a49588b03d1.json
