name: Python regression tests

on:
  push:
    branches:
      - main
      - "dev/**"
      - "fix/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "fix/**"
      - "feature/**"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build --tag zeynal-bot-core:ci .
      - name: Build isolated FAZ39 sandbox image
        run: docker build --file Dockerfile.faz39-sandbox --build-arg FAZ39_SOURCE_SHA="$(git rev-parse HEAD)" --tag zeynal-faz39-sandbox:ci .
      - name: Run synthetic recovery without network or persistent mounts
        run: >-
          docker run --rm --network=none --read-only --cap-drop=ALL
          --security-opt=no-new-privileges
          --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777
          --env FAZ39_SANDBOX=SYNTHETIC_TEST_ONLY
          --env FAZ39_STORAGE_MODE=LOCAL_ONLY
          zeynal-faz39-sandbox:ci
