name: Official club source pilot (isolated, no network)
on:
  push:
    branches:
      - feature/official-club-news-pilot-20261119
      - release/integrated-club-20261119
    paths:
      - 'hybrid_engine/official_club_*'
      - 'tests/test_official_club_*'
      - '.github/workflows/official-club-pilot-tests.yml'
  pull_request:
    paths:
      - 'hybrid_engine/official_club_*'
      - 'tests/test_official_club_*'
      - '.github/workflows/official-club-pilot-tests.yml'
permissions:
  contents: read
jobs:
  offline-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline contract test dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.4 aiohttp==3.12.15 numpy==2.1.3
      - name: Check syntax and module imports without accessing providers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m py_compile hybrid_engine/official_club_sources.py hybrid_engine/official_club_link_discovery.py hybrid_engine/official_club_pilot.py hybrid_engine/official_club_article_probe.py hybrid_engine/official_club_claims.py hybrid_engine/official_club_link_diagnostics.py hybrid_engine/official_club_embedded_diagnostics.py hybrid_engine/official_club_nba_posts.py hybrid_engine/official_club_nba_claims.py hybrid_engine/official_club_capture.py hybrid_engine/official_club_prematch_gate.py hybrid_engine/official_club_team_crosswalk.py hybrid_engine/official_club_identity_pilot.py hybrid_engine/official_club_local_inventory.py hybrid_engine/official_club_frozen_receipt_audit.py hybrid_engine/official_club_fixture_outcome_audit.py tests/test_official_club_sources.py tests/test_official_club_link_discovery.py tests/test_official_club_article_probe.py tests/test_official_club_claims.py tests/test_official_club_pilot_cli.py tests/test_official_club_link_diagnostics.py tests/test_official_club_embedded_diagnostics.py tests/test_official_club_nba_posts.py tests/test_official_club_nba_claims.py tests/test_official_club_prematch_gate.py tests/test_official_club_identity_pilot.py tests/test_official_club_local_inventory.py tests/test_official_club_frozen_receipt_audit.py tests/test_official_club_fixture_outcome_audit.py
      - name: Run six-club no-network regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: '.'
        run: python -m pytest -q tests/test_official_club_sources.py tests/test_official_club_link_discovery.py tests/test_official_club_article_probe.py tests/test_official_club_claims.py tests/test_official_club_pilot_cli.py tests/test_official_club_link_diagnostics.py tests/test_official_club_embedded_diagnostics.py tests/test_official_club_nba_posts.py tests/test_official_club_nba_claims.py tests/test_official_club_prematch_gate.py tests/test_official_club_identity_pilot.py tests/test_official_club_local_inventory.py tests/test_official_club_frozen_receipt_audit.py tests/test_official_club_fixture_outcome_audit.py

      - name: Test 82-club inventory and three-league shadow player simulations
        env:
          PYTHONPATH: '.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q tests/test_official_club_coverage.py tests/test_official_club_final_staging.py tests/test_official_club_stage_settlement.py tests/test_official_all_82_club_batch.py tests/test_official_club_rotation_scenarios.py tests/test_official_club_fixture_news.py
