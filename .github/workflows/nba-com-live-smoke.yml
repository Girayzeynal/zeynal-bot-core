name: NBA.com historical live smoke (manual, read-only)

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Supported NBA team abbreviation"
        required: true
        type: choice
        options:
          - SA
          - UTAH

permissions:
  contents: read

jobs:
  nba-com-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Probe NBA.com historical games (no production writes)
        env:
          NBA_SMOKE_TEAM: ${{ inputs.team }}
        run: python -m providers.nba_com_live_smoke "$NBA_SMOKE_TEAM"
